<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Graphe</title>
  <link rel="stylesheet" href="dist.css">
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 overflow-hidden h-screen flex flex-col">

  <!-- Pane container -->
  <div id="pane-root" class="flex-1 overflow-hidden"></div>

  <!-- Navigation dialog -->
  <div id="nav-overlay" class="hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-[560px] max-h-[80vh] flex flex-col overflow-hidden">
      <!-- Quick input -->
      <div class="p-4 border-b border-gray-200 dark:border-gray-700">
        <input id="nav-input" type="text" data-i18n-placeholder="navPlaceholder" placeholder="Type a reference, e.g. Gn 1:3 or Mt 5"
          class="w-full px-4 py-3 text-lg rounded-lg border border-gray-300 dark:border-gray-600
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
          autocomplete="off">
      </div>
      <!-- Grid area -->
      <div id="nav-grid" class="p-4 overflow-y-auto flex-1">
        <!-- Populated dynamically: books grid or chapter grid -->
      </div>
      <!-- Back / Close -->
      <div class="p-3 border-t border-gray-200 dark:border-gray-700 flex justify-between">
        <button id="nav-back" class="hidden px-4 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-700
                hover:bg-gray-300 dark:hover:bg-gray-600 cursor-pointer transition-colors inline-flex items-center gap-2"
                type="button">
          <svg xmlns="http://www.w3.org/2000/svg" class="lucide lucide-arrow-left w-4 h-4" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>
          <span data-i18n="back">Back</span>
        </button>
        <button id="nav-close" class="px-4 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-700
                hover:bg-gray-300 dark:hover:bg-gray-600 cursor-pointer ml-auto transition-colors"
                data-i18n="close">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Settings dialog -->
  <div id="settings-overlay" class="hidden fixed inset-0 z-40 bg-black/50 flex items-center justify-center">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-[360px] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold" data-i18n="settings">Settings</h2>
      </div>
      <div class="p-4 flex flex-col gap-4">
        <!-- Theme row -->
        <div class="flex items-center justify-between">
          <span data-i18n="theme">Theme</span>
          <button id="settings-theme-toggle"
            class="px-4 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600
                   cursor-pointer transition-colors text-sm font-medium">
            <span id="settings-theme-label" data-i18n="light">Light</span>
          </button>
        </div>
        <!-- Font size row -->
        <div class="flex items-center justify-between">
          <span data-i18n="fontSize">Font size</span>
          <select id="settings-font-size"
            class="app-select pl-3 pr-8 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600
                   bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-gray-100
                   cursor-pointer">
            <option value="14">14px</option>
            <option value="16">16px</option>
            <option value="18">18px</option>
            <option value="20" selected>20px</option>
            <option value="22">22px</option>
            <option value="24">24px</option>
            <option value="28">28px</option>
          </select>
        </div>
        <!-- Language row -->
        <div class="flex items-center justify-between">
          <span data-i18n="language">Language</span>
          <select id="settings-lang-select"
            class="app-select pl-3 pr-8 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600
                   bg-white dark:bg-gray-700 text-sm text-gray-900 dark:text-gray-100
                   cursor-pointer">
            <option value="pt">PT</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
          </select>
        </div>
      </div>
      <div class="p-3 border-t border-gray-200 dark:border-gray-700 flex justify-end">
        <button id="settings-close" class="px-4 py-2 text-sm rounded-lg bg-gray-200 dark:bg-gray-700
                hover:bg-gray-300 dark:hover:bg-gray-600 cursor-pointer transition-colors"
                data-i18n="close">
          Close
        </button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/verse-utils.js"></script>
  <script src="js/bible-view.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/pane-manager.js"></script>
  <script src="js/search-panel.js"></script>
  <script src="js/dict-panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
