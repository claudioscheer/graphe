[package]
name = "graphe"
version = "1.0.11"
edition = "2021"
description = "Graphe Bible study app"
license = "MIT"
publish = false

[[bin]]
name = "graphe"
path = "src/main.rs"

[dependencies]
graphe-domain = { path = "../graphe-domain" }
graphe-store = { path = "../graphe-store" }
eframe = "0.33"
egui = "0.33"
open = "5"
rfd = "0.15"
indexmap = "2"
serde_json = "1"
ureq = "2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
