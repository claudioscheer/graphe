[package]
name = "graphe-store"
version = "1.0.11"
edition = "2021"
description = "SQLite modules, converters, and ~/.graphe state for Graphe"
license = "MIT"
publish = false

[dependencies]
graphe-domain = { path = "../graphe-domain" }
dirs = "6"
flate2 = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
