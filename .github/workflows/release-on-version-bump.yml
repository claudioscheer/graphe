name: Release On Version Bump

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-bump:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect package version bump
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${CURRENT_VERSION}"

          PREVIOUS_VERSION=""
          if git show HEAD^:package.json >/dev/null 2>&1; then
            PREVIOUS_VERSION=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          fi

          if [ -z "${PREVIOUS_VERSION}" ] || [ "${CURRENT_VERSION}" != "${PREVIOUS_VERSION}" ]; then
            VERSION_CHANGED="true"
          else
            VERSION_CHANGED="false"
          fi

          echo "version_changed=${VERSION_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          echo "Current version: ${CURRENT_VERSION}"
          echo "Previous version: ${PREVIOUS_VERSION:-<none>}"
          echo "Version changed: ${VERSION_CHANGED}"

  build:
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            make_script: make:mac
            artifact_name: release-assets-mac
          - os: ubuntu-latest
            make_script: make:linux
            artifact_name: release-assets-linux
          - os: windows-latest
            make_script: make:win
            artifact_name: release-assets-win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Build desktop artifacts
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            DEBUG=electron-forge:*,electron-installer-debian* npm run ${{ matrix.make_script }}
          else
            npm run ${{ matrix.make_script }}
          fi

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-assets
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const root = path.resolve('out');
          const output = path.resolve('release-assets');
          const allowedExtensions = new Set([
            '.dmg',
            '.deb',
            '.appimage',
            '.rpm',
            '.exe',
            '.msi',
            '.pkg',
            '.zip',
          ]);

          function walk(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
                continue;
              }

              if (!entry.isFile()) {
                continue;
              }

              const lowerPath = fullPath.toLowerCase();
              const extension = path.extname(lowerPath);
              if (!allowedExtensions.has(extension)) {
                continue;
              }

              const destination = path.join(output, path.basename(fullPath));
              fs.copyFileSync(fullPath, destination);
            }
          }

          if (!fs.existsSync(root)) {
            process.exit(1);
          }

          walk(root);
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs:
      - detect-version-bump
      - build
    if: needs.detect-version-bump.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag_name }}
          name: ${{ needs.detect-version-bump.outputs.tag_name }}
          generate_release_notes: true
          files: release-assets/*
          overwrite_files: true
